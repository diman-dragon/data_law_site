      <a href="/" class="text-logo">
        <span class="logo-main">DATA LAW</span>
        <span class="logo-sub">GLOBAL TECHNOLOGIES FOR HUMAN RIGHTS</span>
      </a>
    </div>

    <nav class="header-nav" id="main-nav">
      <a href="/" class="nav-item">Миссия</a>
      <a href="/pages/interpol/" class="nav-item">Интерпол</a>
      <a href="/pages/practice/" class="nav-item">Практика</a>
      <a href="/pages/integration/" class="nav-item">Интеграция</a>
      <a href="/pages/education/" class="nav-item">Академия</a>
      <a href="/pages/library/" class="nav-item">Библиотека</a>
      <a href="/pages/crm/" class="nav-item">CRM</a>
      <a href="/pages/ai-navigator/" class="nav-item">AI-Навигатор</a>
      <a href="/pages/contacts/" class="nav-btn">Контакты</a>
    </nav>
  </div>
</header>

<style>
  :root {
    --washi-base: #E6E1C5;
    --navy-dark: #1a1a1a;
    --accent-gold: #c5a87c;
    --font-main: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }

  .site-header {
    background-color: var(--washi-base);
    background-image: url("https://www.transparenttextures.com/patterns/handmade-paper.png");
    border-bottom: 1px solid rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 1000;
  }

  .header-inner {
    display: flex;
    align-items: center;
    height: 100px;
    max-width: 100%;
    margin: 0 auto;
  }

  .logo-section {
    flex: 0 0 33.333%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .text-logo {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo-main {
    font-family: var(--font-main);
    font-size: 30px;
    font-weight: 800;
    color: #000;
    line-height: 1;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 0 #ccc, 0 2px 0 #c9c9c9, 0 4px 1px rgba(0,0,0,.1);
  }

  .logo-sub {
    font-family: var(--font-main);
    font-size: 9px;
    font-weight: 600;
    color: var(--navy-dark);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    margin-top: 8px;
    opacity: 0.8;
  }

  .header-nav {
    flex: 1;
    display: flex;
    justify-content: flex-end;
    gap: 25px;
    padding-right: 50px;
    align-items: center;
  }

  .nav-item {
    text-decoration: none;
    color: var(--navy-dark);
    font-family: 'Jost', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.6;
    transition: 0.3s ease;
    position: relative;
    padding: 10px 0;
  }

  /* Состояние при наведении */
  .nav-item:hover {
    opacity: 1;
  }

  /* КЛАСС ВЫДЕЛЕНИЯ: жирный шрифт + подчеркивание */
  .nav-item.active {
    opacity: 1;
    color: #000 !important;
    font-weight: 700;
  }

  .nav-item.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background-color: var(--accent-gold);
    border-radius: 2px;
  }

  .nav-btn {
    text-decoration: none;
    background: #000;
    color: var(--washi-base) !important;
    padding: 12px 24px;
    border-radius: 2px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    margin-left: 10px;
  }
</style>

<script>
  // Скрипт автоматически добавляет класс 'active' текущей странице
  document.addEventListener("DOMContentLoaded", function() {
    const currentUrl = window.location.pathname;
    const navItems = document.querySelectorAll('.nav-item');
    
    navItems.forEach(item => {
      // Проверяем, совпадает ли href ссылки с текущим адресом
      if (item.getAttribute('href') === currentUrl || 
          (currentUrl.includes(item.getAttribute('href')) && item.getAttribute('href') !== '/')) {
        item.classList.add('active');
      }
    });
  });
</script>
