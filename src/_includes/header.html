<style>
  :root {
    --washi-base: #E6E1C5;
    --navy-dark: #1a1a1a;
    --accent-gold: #c5a87c;
    --font-main: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    --transition-speed: 0.3s;
  }

  /* ФОН И ГРАНИЦЫ */
  .site-header {
    background-color: var(--washi-base);
    background-image: url("https://www.transparenttextures.com/patterns/handmade-paper.png");
    border-bottom: 1px solid rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
    width: 100%;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 100px;
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 40px;
  }

  /* ЛОГОТИП */
  .logo-section {
    flex-shrink: 0;
  }

  .text-logo {
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .logo-main {
    font-family: var(--font-main);
    font-size: 28px;
    font-weight: 800;
    color: #000;
    line-height: 1;
    letter-spacing: 0.05em;
    text-shadow: 0 1px 0 #ccc, 0 2px 0 #c9c9c9;
  }

  .logo-sub {
    font-family: var(--font-main);
    font-size: 8.5px;
    font-weight: 700;
    color: var(--navy-dark);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-top: 6px;
    opacity: 0.75;
  }

  /* НАВИГАЦИЯ И ГРУППЫ */
  .header-nav {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .nav-group {
    position: relative;
    padding: 10px 0;
  }

  .nav-item {
    text-decoration: none;
    color: var(--navy-dark);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 15px 18px;
    cursor: pointer;
    opacity: 0.65;
    transition: all var(--transition-speed) ease;
    display: inline-block;
  }

  .nav-item::after {
    content: ' ▾';
    font-size: 0.7rem;
    opacity: 0.5;
  }

  .nav-group:hover .nav-item {
    opacity: 1;
    color: #000;
  }

  /* ВЫПАДАЮЩЕЕ МЕНЮ (DROPDOWN) */
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: #fdfdfb; /* Цвет чистой бумаги */
    min-width: 240px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.12);
    border: 1px solid rgba(0,0,0,0.06);
    display: none;
    flex-direction: column;
    padding: 12px 0;
    border-radius: 3px;
    opacity: 0;
    transition: 0.3s ease;
  }

  .nav-group:hover .dropdown-menu {
    display: flex;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .dropdown-menu a {
    text-decoration: none;
    color: var(--navy-dark);
    padding: 12px 25px;
    font-size: 0.82rem;
    font-weight: 500;
    transition: 0.2s;
    border-left: 3px solid transparent;
  }

  .dropdown-menu a:hover {
    background: var(--washi-base);
    color: #000;
    border-left: 3px solid var(--accent-gold);
  }

  /* КНОПКА КОНТАКТЫ */
  .nav-btn {
    text-decoration: none;
    background: #000;
    color: var(--washi-base) !important;
    padding: 12px 24px;
    border-radius: 2px;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-left: 20px;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }

  .nav-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    filter: brightness(1.2);
  }

  /* АКТИВНОЕ СОСТОЯНИЕ */
  .nav-item--active {
    opacity: 1 !important;
    color: #000 !important;
  }

  /* АДАПТИВНОСТЬ */
  @media (max-width: 1200px) {
    .header-inner { padding: 0 20px; height: 85px; }
    .logo-main { font-size: 22px; }
    .nav-item { font-size: 0.72rem; padding: 10px 10px; }
    .dropdown-menu { min-width: 200px; }
  }
</style>

<script>
  // Логика подсветки активного раздела
  document.addEventListener('DOMContentLoaded', () => {
    const currentPath = window.location.pathname;
    const navGroups = document.querySelectorAll('.nav-group');
    
    navGroups.forEach(group => {
      const links = group.querySelectorAll('.dropdown-menu a');
      links.forEach(link => {
        const path = new URL(link.href).pathname;
        if (currentPath === path && path !== '/') {
          group.querySelector('.nav-item').classList.add('nav-item--active');
          link.style.fontWeight = '700';
          link.style.color = 'var(--accent-gold)';
        }
      });
    });
  });
</script>
